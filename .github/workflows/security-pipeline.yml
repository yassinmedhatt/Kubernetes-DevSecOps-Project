name: Secure Kubernetes Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read        

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start application
        run: |
          node src/server.js > app.log 2>&1 &
          echo $! > app.pid

      - name: Health check
        run: |
          for i in {1..10}; do
            if curl --fail http://localhost:3000/health; then
              exit 0
            fi
            sleep 1
          done

          cat app.log
          exit 1

      - name: Stop application
        if: always()
        run: |
          if [ -f app.pid ]; then
            kill $(cat app.pid) || true
          fi

  sast:
    name: SAST - CodeQL
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v4


  sca:
    name: SCA - Dependency Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency vulnerability scan
        run: npm audit --audit-level=high


  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs : [ci, sast, sca]

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build Docker image
        run: docker build -t secure-k8s-api:${{ github.sha }} .

      - name: Save Docker image
        run: docker save secure-k8s-api:${{ github.sha }} -o secure-k8s-api.tar

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: secure-k8s-api-image
          path: secure-k8s-api.tar
          retention-days: 1

  trivy:
    name: Trivy - Container Vulnerability Scan
    runs-on: ubuntu-latest
    needs: docker-build

    permissions:
      contents: read

    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v5
        with:
          name: secure-k8s-api-image

      - name: Load Docker image
        run: docker load -i secure-k8s-api.tar

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: secure-k8s-api:${{ github.sha }}
          format: table
          exit-code: '0'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  sbom:
    name: SBOM - Generate Software Bill of Materials
    runs-on: ubuntu-latest
    needs: docker-build

    permissions:
      contents: read

    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v5
        with:
          name: secure-k8s-api-image

      - name: Load Docker image
        run: docker load -i secure-k8s-api.tar

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: secure-k8s-api:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: secure-k8s-api-sbom
          path: sbom.json      

  publish:
    name: Publish Image to GHCR
    runs-on: ubuntu-latest
    needs: [trivy, sbom]

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v5
        with:
          name: secure-k8s-api-image

      - name: Load Docker image
        run: docker load -i secure-k8s-api.tar

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag image
        run: |
          docker tag \
            secure-k8s-api:${{ github.sha }} \
            ghcr.io/${{ github.repository_owner }}/kubernetes-devsecops-project:${{ github.sha }}

      - name: Push image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/kubernetes-devsecops-project:${{ github.sha }}

  deploy:
    name: Deploy to Minikube
    runs-on: self-hosted
    needs: publish

    # Never let pull-request code execute on the personal self-hosted runner.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: read

    steps:

      - name: Verify Minikube
        shell: powershell
        run: |
          minikube status
          kubectl cluster-info

      - name: Log in to GitHub Container Registry
        shell: powershell
        run: |
          $env:GITHUB_TOKEN | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull exact image from GHCR
        shell: powershell
        run: |
          docker pull ghcr.io/${{ github.repository_owner }}/kubernetes-devsecops-project:${{ github.sha }}

      - name: Load image into Minikube
        shell: powershell
        run: |
          minikube image load ghcr.io/${{ github.repository_owner }}/kubernetes-devsecops-project:${{ github.sha }}

      - name: Deploy exact image to Kubernetes
        shell: powershell
        run: |
          kubectl set image deployment/secure-k8s-api `
            secure-k8s-api=ghcr.io/${{ github.repository_owner }}/kubernetes-devsecops-project:${{ github.sha }} `
            -n secure-k8s

      - name: Wait for rollout
        shell: powershell
        run: |
          kubectl rollout status deployment/secure-k8s-api -n secure-k8s --timeout=120s

      - name: Verify application health
        shell: powershell
        run: |
          $pod = kubectl get pod -n secure-k8s `
            -l app=secure-k8s-api `
            -o jsonpath="{.items[0].metadata.name}"

          kubectl exec $pod -n secure-k8s -- `
            wget -qO- http://localhost:3000/health
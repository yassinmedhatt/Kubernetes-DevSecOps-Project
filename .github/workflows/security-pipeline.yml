name: Secure Kubernetes Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start application
        run: |
          node src/server.js > app.log 2>&1 &
          echo $! > app.pid

      - name: Health check
        run: |
          for i in {1..10}; do
            if curl --fail http://localhost:3000/health; then
              exit 0
            fi
            sleep 1
          done

          cat app.log
          exit 1

      - name: Stop application
        if: always()
        run: |
          if [ -f app.pid ]; then
            kill $(cat app.pid) || true
          fi